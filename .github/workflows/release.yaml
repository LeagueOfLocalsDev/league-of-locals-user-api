name: Build and Deploy User API

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag (the commit SHA previously built from main)"
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/leagueoflocalsdev/league-of-locals-user-api:${{ github.sha }}

  deploy-dev:
    needs: build-and-push
    uses: ./.github/workflows/deploy.yaml
    with:
      github_environment: dev
      namespace: league-of-locals-dev
      values_file: ./helm/league-of-locals-user-api/values-dev.yaml
      image_tag: ${{ github.sha }}
    secrets: inherit

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yaml
    with:
      github_environment: production
      namespace: league-of-locals-prod
      values_file: ./helm/league-of-locals-user-api/values-prod.yaml
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
