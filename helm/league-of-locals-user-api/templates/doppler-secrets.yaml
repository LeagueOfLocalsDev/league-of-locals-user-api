{{- $project := required "doppler.project must be set to the Doppler project slug" .Values.doppler.project -}}
{{- $config := required "doppler.config must be set to the Doppler config slug" .Values.doppler.config -}}
{{- $tokenName := required "doppler.tokenSecretName must be set" .Values.doppler.tokenSecretName -}}
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: {{ include "league-of-locals-user-api.fullname" . }}-application
  namespace: {{ .Release.Namespace }}
spec:
  tokenSecret:
    name: {{ $tokenName }}
  project: {{ $project | quote }}
  config: {{ $config | quote }}
  managedSecret:
    name: {{ required "doppler.applicationSecretName must be set" .Values.doppler.applicationSecretName }}
    namespace: {{ .Release.Namespace }}
  secrets:
    - DB_URL
    - DB_USERNAME
    - DB_PASSWORD
    - AUTH0_DOMAIN
    - AUTH0_CLIENT_ID
    - AUTH0_CLIENT_SECRET
{{- if .Values.doppler.registry.enabled }}
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: {{ include "league-of-locals-user-api.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
spec:
  tokenSecret:
    name: {{ $tokenName }}
  project: {{ $project | quote }}
  config: {{ $config | quote }}
  managedSecret:
    name: {{ required "doppler.registry.secretName must be set when the registry sync is enabled" .Values.doppler.registry.secretName }}
    namespace: {{ .Release.Namespace }}
    type: kubernetes.io/dockerconfigjson
  secrets:
    - DOCKER_CONFIG_JSON
  processors:
    DOCKER_CONFIG_JSON:
      asName: .dockerconfigjson
      type: plain
{{- end }}
